<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>%title%</title>

        <link href="%contextRoot%/webjars/swagger-ui/${swagger-ui.version}/swagger-ui.css" rel="stylesheet" type="text/css" />
        <link href="%contextRoot%/webjars/swagger-ui-themes/${swagger.ui.themes.version}/themes/3.x/theme-%swaggerUiTheme%.css" rel="stylesheet" type="text/css" />
        <link href="style.css" rel="stylesheet" type="text/css" />
        <style>%authDialogStyle%</style>
    </head>

    <body>
        <div id="swagger-ui"></div>
        <script src='%contextRoot%/webjars/swagger-ui/${swagger-ui.version}/swagger-ui-bundle.js' type='text/javascript'></script>
        <script src='%contextRoot%/webjars/swagger-ui/${swagger-ui.version}/swagger-ui-standalone-preset.js' type='text/javascript'></script>

                        a = md5ff(a, b, c, d, x[i + 4], 7, -176418897); d = md5ff(d, a, b, c, x[i + 5], 12, 1200080426); c = md5ff(c, d, a, b, x[i + 6], 17, -1473231341); b = md5ff(b, c, d, a, x[i + 7], 22, -45705983);
                        a = md5ff(a, b, c, d, x[i + 8], 7, 1770035416); d = md5ff(d, a, b, c, x[i + 9], 12, -1958414417); c = md5ff(c, d, a, b, x[i + 10], 17, -42063); b = md5ff(b, c, d, a, x[i + 11], 22, -1990404162);
                        a = md5ff(a, b, c, d, x[i + 12], 7, 1804603682); d = md5ff(d, a, b, c, x[i + 13], 12, -40341101); c = md5ff(c, d, a, b, x[i + 14], 17, -1502002290); b = md5ff(b, c, d, a, x[i + 15], 22, 1236535329);
                        a = md5gg(a, b, c, d, x[i + 1], 5, -165796510); d = md5gg(d, a, b, c, x[i + 6], 9, -1069501632); c = md5gg(c, d, a, b, x[i + 11], 14, 643717713); b = md5gg(b, c, d, a, x[i], 20, -373897302);
                        a = md5gg(a, b, c, d, x[i + 5], 5, -701558691); d = md5gg(d, a, b, c, x[i + 10], 9, 38016083); c = md5gg(c, d, a, b, x[i + 15], 14, -660478335); b = md5gg(b, c, d, a, x[i + 4], 20, -405537848);
                        a = md5gg(a, b, c, d, x[i + 9], 5, 568446438); d = md5gg(d, a, b, c, x[i + 14], 9, -1019803690); c = md5gg(c, d, a, b, x[i + 3], 14, -187363961); b = md5gg(b, c, d, a, x[i + 8], 20, 1163531501);
                        a = md5gg(a, b, c, d, x[i + 13], 5, -1444681467); d = md5gg(d, a, b, c, x[i + 2], 9, -51403784); c = md5gg(c, d, a, b, x[i + 7], 14, 1735328473); b = md5gg(b, c, d, a, x[i + 12], 20, -1926607734);
                        a = md5hh(a, b, c, d, x[i + 5], 4, -378558); d = md5hh(d, a, b, c, x[i + 8], 11, -2022574463); c = md5hh(c, d, a, b, x[i + 11], 16, 1839030562); b = md5hh(b, c, d, a, x[i + 14], 23, -35309556);
                        a = md5hh(a, b, c, d, x[i + 1], 4, -1530992060); d = md5hh(d, a, b, c, x[i + 4], 11, 1272893353); c = md5hh(c, d, a, b, x[i + 7], 16, -155497632); b = md5hh(b, c, d, a, x[i + 10], 23, -1094730640);
                        a = md5hh(a, b, c, d, x[i + 13], 4, 681279174); d = md5hh(d, a, b, c, x[i], 11, -358537222); c = md5hh(c, d, a, b, x[i + 3], 16, -722521979); b = md5hh(b, c, d, a, x[i + 6], 23, 76029189);
                        a = md5hh(a, b, c, d, x[i + 9], 4, -640364487); d = md5hh(d, a, b, c, x[i + 12], 11, -421815835); c = md5hh(c, d, a, b, x[i + 15], 16, 530742520); b = md5hh(b, c, d, a, x[i + 2], 23, -995338651);

                        a = md5ii(a, b, c, d, x[i + 4], 6, -145523070); d = md5ii(d, a, b, c, x[i + 11], 10, -1120210379); c = md5ii(c, d, a, b, x[i + 2], 15, 718787259); b = md5ii(b, c, d, a, x[i + 9], 21, -343485551);

                function binl2rstr(input) { var i, output = ''; var length32 = input.length * 32; for (i = 0; i < length32; i += 8) { output += String.fromCharCode((input[i >> 5] >>> (i % 32)) & 0xff); } return output; }

            /* eslint-enable */
        </script>
        <script>
            var defined_apis = %urlsData%;
            // Path prefixes whose modules are secured via HTTP Digest (configured via openapi.ui.digestPaths).
            var digest_paths = %digestPathsData%;
            // Optional OIDC/OAuth2 client preset for the native Swagger UI "Authorize" dialog.
            var oauth2ClientId = "%oauth2ClientId%";
            // Hide the unused client_secret field for public clients (openapi.ui.oauth2HideClientSecret).
            var hideClientSecret = %hideClientSecret%;

            // Swagger UI always renders a client_secret input for auth-code flows. For a public
            // client + PKCE it is unused, so hide its row by label text (markup-version-agnostic).
            function installClientSecretHider() {
                if (!hideClientSecret) return;
                var hide = function () {
                    var labels = document.querySelectorAll('.auth-container label');
                    for (var i = 0; i < labels.length; i++) {
                        var t = (labels[i].textContent || '').trim().toLowerCase();
                        if (t.indexOf('client_secret') === 0 || t.indexOf('client secret') === 0) {
                            labels[i].style.display = 'none';
                        }
                    }
                };
                new MutationObserver(hide).observe(document.body, { childList: true, subtree: true });
                hide();
            }

            function buildUi(cfg) {
                var ui = SwaggerUIBundle(cfg);
                if (oauth2ClientId) {
                    ui.initOAuth({
                        clientId: oauth2ClientId,
                        scopes: "openid",
                        usePkceWithAuthorizationCodeGrant: true
                    });
                }
                installClientSecretHider();
                return ui;
            }
            // Cached digest challenge + credentials (per Swagger UI session). Single protection space for the PoC.
            var digestState = { challenge: null, nc: 0, username: null, password: null };

            function toPathname(url) {
                try { return new URL(url, window.location.origin).pathname; } catch (e) { return url || ''; }
            }

            function isDigestUrl(url) {
                if (!digest_paths || digest_paths.length === 0) return false;
                var p = toPathname(url);
                return digest_paths.some(function (prefix) { return prefix && p.indexOf(prefix) === 0; });
            }

            function parseDigestChallenge(headerValue) {
                var params = {};
                var stripped = headerValue.replace(/^\s*[Dd]igest\s+/, '');
                var re = /(\w+)\s*=\s*(?:"([^"]*)"|([^,]+))/g, m;
                while ((m = re.exec(stripped)) !== null) {
                    params[m[1].toLowerCase()] = (m[2] !== undefined) ? m[2] : m[3].trim();
                }
                return params;
            }

            async function ensureDigestChallenge(probeUrl, method) {
                if (digestState.challenge) return digestState.challenge;
                // Pre-flight to obtain the WWW-Authenticate: Digest challenge (realm/nonce/qop/opaque).
                // A script-set Authorization header suppresses the browser's native credential popup
                // on the 401 (the browser assumes the app handles auth) while we still read the header.
                var probe = await fetch(probeUrl, {
                    method: method,
                    headers: { 'X-Swagger-Digest-Probe': '1', 'Authorization': 'Digest probe' }
                });
                if (probe.status !== 401) return null;
                var wa = probe.headers.get('WWW-Authenticate');
                if (!wa || wa.toLowerCase().indexOf('digest') < 0) return null;
                digestState.challenge = parseDigestChallenge(wa);
                return digestState.challenge;
            }

            async function applyDigestAuth(req) {
                // Credential source #1: a Basic header that Swagger UI's "Authorize" dialog attached
                // for this module (the module declares an http/basic scheme purely to capture the
                // username/password). Decode it so we can recompute it as a Digest response. Re-read
                // every time so re-authorizing with new credentials takes effect.
                var basic = req.headers && (req.headers['Authorization'] || req.headers['authorization']);
                if (basic && /^Basic\s+/i.test(basic)) {
                    try {
                        var decoded = atob(basic.replace(/^Basic\s+/i, ''));
                        var sep = decoded.indexOf(':');
                        digestState.username = sep >= 0 ? decoded.substring(0, sep) : decoded;
                        digestState.password = sep >= 0 ? decoded.substring(sep + 1) : '';
                    } catch (e) { /* fall through to prompt */ }
                }

                // Probe first: an unprotected path under the same prefix (e.g. the open /module-b/openapi
                // document) is not challenged, so we must not prompt for credentials in that case.
                var c = await ensureDigestChallenge(req.url, req.method);
                if (!c || !c.realm || !c.nonce) return req;

                // Credential source #2 (fallback): prompt, if the user did not use the Authorize dialog.
                if (!digestState.username) {
                    var u = window.prompt('HTTP Digest authentication (' + c.realm + ')\nUsername:');
                    if (u === null) return req;
                    var pw = window.prompt('HTTP Digest authentication (' + c.realm + ')\nPassword:');
                    digestState.username = u;
                    digestState.password = pw === null ? '' : pw;
                }

                var url = new URL(req.url, window.location.origin);
                var uri = url.pathname + (url.search || '');
                var qop = c.qop ? c.qop.split(',')[0].trim() : null;
                var ha1 = md5(digestState.username + ':' + c.realm + ':' + digestState.password);
                var ha2 = md5(req.method + ':' + uri);
                var response, headerParts;

                if (qop) {
                    digestState.nc += 1;
                    var nc = ('00000000' + digestState.nc).slice(-8);
                    var cnonce = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
                    response = md5(ha1 + ':' + c.nonce + ':' + nc + ':' + cnonce + ':' + qop + ':' + ha2);
                    headerParts = ['username="' + digestState.username + '"', 'realm="' + c.realm + '"',
                        'nonce="' + c.nonce + '"', 'uri="' + uri + '"', 'qop=' + qop,
                        'nc=' + nc, 'cnonce="' + cnonce + '"', 'response="' + response + '"'];
                } else {
                    response = md5(ha1 + ':' + c.nonce + ':' + ha2);
                    headerParts = ['username="' + digestState.username + '"', 'realm="' + c.realm + '"',
                        'nonce="' + c.nonce + '"', 'uri="' + uri + '"', 'response="' + response + '"'];
                }
                if (c.opaque) headerParts.push('opaque="' + c.opaque + '"');
                if (c.algorithm) headerParts.push('algorithm=' + c.algorithm);
                req.headers['Authorization'] = 'Digest ' + headerParts.join(', ');
                return req;
            }

            // Single, context-root-aware interceptor: digest for the configured modules,
            // and untouched (so Swagger UI's native OIDC bearer survives) for everything else.
            async function perModuleRequestInterceptor(req) {
                if (isDigestUrl(req.url)) {
                    try { return await applyDigestAuth(req); } catch (e) { return req; }
                }
                return req;
            }

            window.onload = async function () {
                var swaggerConfig = {
                    dom_id: '#swagger-ui',
                    oauth2RedirectUrl: "%oauth2RedirectUri%",
                    requestInterceptor: perModuleRequestInterceptor,
                    deepLinking: true,
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIStandalonePreset
                    ],
                    plugins: [
                        SwaggerUIBundle.plugins.DownloadUrl
                    ],
                    layout: "StandaloneLayout"
                };

                if (defined_apis) {
                    var available = [];
                    var unavailable = [];

                    await Promise.all(defined_apis.map(async function (api) {
                        try {
                            var resp = await fetch(api.url, { method: 'HEAD' });
                            if (resp.ok) {
                                available.push(api);
                            } else {
                                unavailable.push(api);
                            }
                        } catch (e) {
                            unavailable.push(api);
                        }
                    }));

                    var byName = function (a, b) {
                        return (a.name || '').localeCompare(b.name || '');
                    };

                    var toPath = function (url) {
                        if (!url) return '';
                        try {
                            return new URL(url, window.location.origin).pathname;
                        } catch (e) {
                            return url;
                        }
                    };

                    // Longest-match wins so nested contexts like /a/b/openapi beat /a/openapi
                    var currentPath = window.location.pathname;
                    var current = null;
                    var currentMatchLen = -1;
                    available.forEach(function (api) {
                        var apiPath = toPath(api.url);
                        if (apiPath && currentPath.startsWith(apiPath + '-ui') && apiPath.length > currentMatchLen) {
                            current = api;
                            currentMatchLen = apiPath.length;
                        }
                    });

                    var others = available.filter(function (api) { return api !== current; }).sort(byName);
                    unavailable.sort(byName);

                    var ordered = current ? [current].concat(others) : others;

                    swaggerConfig.urls = ordered.length > 0 ? ordered : defined_apis;
                    if (current) {
                        swaggerConfig['urls.primaryName'] = current.name;
                    }
                    window.ui = buildUi(swaggerConfig);

                    if ((current && others.length > 0) || unavailable.length > 0) {
                        setTimeout(function () {
                            var select = document.querySelector('.swagger-ui .topbar select');
                            if (!select) return;

                            if (current && others.length > 0) {
                                var sepOther = document.createElement('option');
                                sepOther.disabled = true;
                                sepOther.textContent = '\u2500\u2500 Other available \u2500\u2500';
                                if (select.options.length > 1) {
                                    select.insertBefore(sepOther, select.options[1]);
                                } else {
                                    select.appendChild(sepOther);
                                }
                            }

                            if (unavailable.length > 0) {
                                var sepUnavail = document.createElement('option');
                                sepUnavail.disabled = true;
                                sepUnavail.textContent = '\u2500\u2500 Unavailable \u2500\u2500';
                                select.appendChild(sepUnavail);

                                unavailable.forEach(function (api) {
                                    var opt = document.createElement('option');
                                    opt.disabled = true;
                                    opt.textContent = api.name;
                                    opt.style.color = '#999';
                                    select.appendChild(opt);
                                });
                            }
                        }, 500);
                    }
                } else {
                    swaggerConfig.url = "%yamlUrl%";
                    window.ui = buildUi(swaggerConfig);
                }
            }
        </script>

        <div id='footer'>
            <p class="swagger-ui-wrap">
                <span class="createdWith">Created with <a target="_blank" href="http://www.microprofile-ext.org" data-sw-translate>MicroProfile Extensions: OpenApi</a></span> . &copy; %currentYear% %copyrighBy%
            </p>
        </div>
    </body>
</html>
