# Serve this module's OpenAPI document at a per-app path on WildFly (SmallRye extension).
mp.openapi.extensions.path=/module-a/openapi

# Declare the OAuth2 password-flow security scheme at runtime (token URL from config, not annotations).
mp.openapi.filter=org.os890.mp.openapi.gui.poc.a.OAuth2SecurityFilter
app.oauth2.tokenUrl=http://localhost:8081/realms/poc/protocol/openid-connect/token

# --- Shared OpenAPI GUI (this module ships its own Swagger UI at /module-a/openapi-ui) ---
openapi.ui.enabled=true
openapi.ui.title=PoC - Shared API Console (OIDC + Digest)
openapi.ui.contextRoot=/module-a
# Full dropdown config: switch between both modules from this UI.
openapi.ui.urls=Module A (OIDC)=/module-a/openapi,Module B (Digest)=/module-b/openapi
# Preset the OIDC "Authorize" dialog (public client, password grant against Keycloak).
openapi.ui.oauth2ClientId=swagger-ui
