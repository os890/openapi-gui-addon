# --- Shared OpenAPI GUI configuration (the whole point of the PoC) ---

# UI always available in this PoC
openapi.ui.enabled=true
openapi.ui.title=PoC - Shared API Console (OIDC + Digest)
openapi.ui.contextRoot=/gui

# Multi-module dropdown: one Swagger UI, two app-modules on the same server.
openapi.ui.urls=Module A (OIDC)=/module-a/openapi,Module B (Digest)=/module-b/openapi

# Per-module auth, driven by the addon:
#  - Module B is HTTP Digest -> addon's context-root-aware requestInterceptor handles it.
#  - Module A is OIDC        -> native Swagger UI "Authorize" (no interceptor needed).
openapi.ui.digestPaths=/module-b

# Preset the OIDC "Authorize" dialog for module A (public client + PKCE against Keycloak).
openapi.ui.oauth2ClientId=swagger-ui
# Public client + PKCE needs no secret, so hide the unused client_secret input in the dialog.
openapi.ui.oauth2HideClientSecret=true
# Swagger UI OAuth2 redirect landing page (served by the bundled swagger-ui webjar under /gui).
openapi.ui.oauth2RedirectUri=/gui/webjars/swagger-ui/5.18.2/oauth2-redirect.html
