# --- Shared OpenAPI GUI configuration (the whole point of the PoC) ---

# UI always available in this PoC
openapi.ui.enabled=true
openapi.ui.title=PoC - Shared API Console (OIDC + Digest)
openapi.ui.contextRoot=/gui

# Multi-module dropdown: one Swagger UI, two app-modules on the same server.
openapi.ui.urls=Module A (OIDC)=/module-a/openapi,Module B (Digest)=/module-b/openapi

# Per-module auth is driven entirely by each module's OpenAPI document:
#  - Module B declares a digest scheme (http/basic + x-auth-mode: digest, via its OASFilter), so the
#    addon's interceptor performs the digest challenge/response when that spec is selected.
#  - Module A declares an oauth2 password scheme (via its OASFilter) -> native Swagger UI Authorize.
# No GUI-side path configuration needed.

# Preset the OIDC "Authorize" dialog for module A (public client, password grant against Keycloak).
openapi.ui.oauth2ClientId=swagger-ui
